[project]
name = "ipsec-at-scale"
version = "0.1.0"
description = "A reproducible strongSwan lab for rekey storms, MTU blackholes and DPD flaps, with an anomaly detector on tunnel telemetry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "click>=8.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
triage = ["google-genai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipseclab*"]

[tool.setuptools.package-data]
ipseclab = ["runbooks.yaml"]
