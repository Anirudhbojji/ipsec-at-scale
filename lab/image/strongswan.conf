charon {
    load_modular = yes
    plugins { include strongswan.d/charon/*.conf }
    # Route-based tunnels: routing decides what enters the tunnel, not charon.
    install_routes = no
    # IKE retransmission: fast enough that DPD declares a peer dead in ~15s
    # in the lab. Production defaults (5 tries, 4s, 1.8) take ~165s.
    retransmit_tries = 3
    retransmit_timeout = 2.0
    retransmit_base = 1.8
    make_before_break = yes
    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            default = 1
            ike = 1
            knl = 1
            cfg = 1
            flush_line = yes
        }
    }
}
